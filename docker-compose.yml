# Patra runs against a managed Postgres (eg: Supabase) supplied via
# PATRA_DATABASE_URL in .env (see .env.sample). There is intentionally no
# local db service here.
#
# All PATRA_* env variables also support the PATRA_*_FILE pattern for loading secrets from files with Docker secrets and Podman
# eg: PATRA_ADMIN_USER -> PATRA_ADMIN_USER_FILE=/path/to/file_with_value

services:
  # patra app
  app:
    build: .
    container_name: patra_app
    restart: unless-stopped
    ports:
      - "9000:9000"                                           # To change the externally exposed port, change to: $custom_port:9000
    hostname: patra.example.com                            # Recommend using FQDN for hostname
    command: [sh, -c, "./patra --install --idempotent --yes --config '' && ./patra --upgrade --yes --config '' && ./patra --config ''"]
                                                              # --config (file) param is set to empty so that patra only uses the env vars (below) for config.
                                                              # --install --idempotent ensures that DB installation happens only once on an empty DB, on the first ever start.
                                                              # --upgrade automatically runs any DB migrations when a new image is pulled.

    env_file:
      - .env                                                  # Patra: PATRA_DATABASE_URL + PATRA_SMTP_* live here (see .env.sample).
    environment:                                              # The same params as in config.toml are passed as env vars here.
      PATRA_app__address: 0.0.0.0:9000
      # Public base URL used for subscription pages, archive links and
      # opt-in confirmation e-mails. Overrides the DB app.root_url (no-op when empty).
      PATRA_app__root_url: "${PATRA_app__root_url:-}"
      # Cloud DB URL (Supabase direct connection, port 5432 — NOT the 6543
      # transaction pooler, as the app uses prepared statements).
      PATRA_DATABASE_URL: "${PATRA_DATABASE_URL:-}"
      # Fallback split DB fields (used only when PATRA_DATABASE_URL is empty).
      PATRA_db__host: ${PATRA_db__host:-}
      PATRA_db__port: ${PATRA_db__port:-}
      PATRA_db__user: ${PATRA_db__user:-}
      PATRA_db__password: "${PATRA_db__password:-}"
      PATRA_db__database: ${PATRA_db__database:-}
      PATRA_db__ssl_mode: ${PATRA_db__ssl_mode:-require}
      PATRA_db__max_open: 25
      PATRA_db__max_idle: 25
      PATRA_db__max_lifetime: 300s
      TZ: Etc/UTC
      PATRA_ADMIN_USER: ${PATRA_ADMIN_USER:-}           # If these (optional) are set during the first `docker compose up`, then the Super Admin user is automatically created.
      PATRA_ADMIN_PASSWORD: "${PATRA_ADMIN_PASSWORD:-}"   # Otherwise, the user can be setup on the web app after the first visit to http://localhost:9000
      # Patra default e-mail channel (Hostinger preset). Empty = use DB / Settings UI.
      PATRA_SMTP_HOST: ${PATRA_SMTP_HOST:-}
      PATRA_SMTP_PORT: ${PATRA_SMTP_PORT:-}
      PATRA_SMTP_USERNAME: ${PATRA_SMTP_USERNAME:-}
      PATRA_SMTP_PASSWORD: "${PATRA_SMTP_PASSWORD:-}"
      PATRA_SMTP_AUTH: ${PATRA_SMTP_AUTH:-}
      PATRA_SMTP_TLS: ${PATRA_SMTP_TLS:-}
      PATRA_SMTP_NAME: ${PATRA_SMTP_NAME:-}
      PATRA_FROM_EMAIL: ${PATRA_FROM_EMAIL:-}
    volumes:
      - ./uploads:/patra/uploads:rw                        # Mount an uploads directory on the host to /patra/uploads inside the container.
                                                              # To use this, change directory path in Admin -> Settings -> Media to /patra/uploads
    networks:
      - web                                                   # Shared with Caddy (~/infra/caddy). Must exist: docker network ls | grep web

networks:
  web:
    external: true
